[project]
name = "blog-newsletter"
version = "0.1.0"
description = "Newsletter automation for Hugo blog"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
send-newsletter = "send_newsletter:main"
publish-post = "publish_post:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["send_newsletter", "publish_post"]

[tool.pytest.ini_options]
testpaths = ["tests"]
