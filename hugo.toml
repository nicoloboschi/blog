baseURL = 'https://nicoloboschi.com/'
languageCode = 'en-us'
title = 'Getting stuff done'
theme = 'hugo-bearcub'
copyright = "Nicolò Boschi"

enableRobotsTXT = true
pagination.pagerSize = 10

[permalinks]
posts = "/posts/:year:month:day"

[markup]
[markup.highlight]
lineNos = true
lineNumbersInTable = false
noClasses = false
[markup.goldmark.renderer]
unsafe = true

[taxonomies]
category = "categories"
tag = "tags"

[related]
includeNewer = true
threshold = 50
toLower = true

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "date"
weight = 10

[params]
description = "Nicolò Boschi - Software Engineer building AI agent memory systems, distributed systems, and developer tools. Creator of Hindsight and pg0."
favicon = "favicon.jpg"
dateFormat = "2006-01-02"
themeStyle = "original"
madeWith = ""
images = ["cover.jpg"]
generateSocialCard = true

[params.author]
email = "boschi1997@gmail.com"
name = "Nicolò Boschi"

[params.newsletter]
enabled = true
buttondownUsername = "nicoloboschi"

