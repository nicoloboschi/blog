<!-- Google Fonts: Inter, Space Grotesk, JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
  /* Body text: Inter Regular */
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight: 400;
  }

  /* Headings: Space Grotesk Bold */
  h1, h2, h3, h4, h5, h6,
  .title h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
  }

  /* Code: JetBrains Mono */
  code, pre, pre code {
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  }

  /* Navigation links */
  nav a {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
  }

  /* Responsive Media Queries */
  @media screen and (max-width: 600px) {
    body {
      padding: 15px;
      font-size: 15px;
    }

    h1 { font-size: 1.6em; }
    h2 { font-size: 1.4em; }
    h3 { font-size: 1.2em; }

    .title h1 {
      font-size: 20px;
    }

    /* Stack blog post list on mobile */
    ul.blog-posts li {
      flex-direction: column;
      margin-bottom: 15px;
    }

    ul.blog-posts li span {
      flex: none;
      margin-bottom: 4px;
      font-size: 0.85em;
    }

    /* Better code blocks on mobile */
    pre code {
      font-size: 13px;
      padding: 15px;
    }

    /* Better tables on mobile */
    table {
      font-size: 14px;
    }

    th, td {
      padding: 4px;
    }
  }

  @media screen and (max-width: 400px) {
    body {
      padding: 10px;
      font-size: 14px;
    }

    pre code {
      font-size: 12px;
      padding: 10px;
    }
  }
</style>

<!-- JSON-LD Structured Data -->
{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ $.Site.Title }}",
  "description": "{{ $.Site.Params.description }}",
  "url": "{{ $.Site.BaseURL }}",
  "author": {
    "@type": "Person",
    "name": "{{ $.Site.Params.author.name }}"
  }
}
</script>
{{ else if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ with .Description }}{{ . | plainify }}{{ else }}{{ .Summary | plainify | truncate 160 }}{{ end }}",
  "url": "{{ .Permalink }}",
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  {{ if .Lastmod }}"dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",{{ end }}
  "author": {
    "@type": "Person",
    "name": "{{ $.Site.Params.author.name }}",
    "url": "{{ $.Site.BaseURL }}"
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ $.Site.Params.author.name }}",
    "url": "{{ $.Site.BaseURL }}"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  }
  {{ with .Params.tags }},"keywords": "{{ delimit . ", " }}"{{ end }}
}
</script>
{{ end }}

<!-- Google Analytics -->
{{ if not hugo.IsDevelopment }}
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8PMLLQRTLS"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8PMLLQRTLS');
</script>
{{ end }}
