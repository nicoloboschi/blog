{{ if or (eq .Kind "taxonomy") (eq .Kind "term") }}
<meta name="robots" content="noindex, follow" />
{{ end }}

<!-- Fonts: Outfit + JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #000;
  --text: #ececec;
  --text-mid: #aaa;
  --text-muted: #555;
  --code-bg: #0a0a0a;
  --border: rgba(255,255,255,0.07);
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  margin: 0; padding: 0;
}

a { color: inherit; text-decoration: none; }

/* Shared gradient text hover — always has gradient bg, opacity toggles it */
.glow-hover,
.glow-text {
  background: linear-gradient(90deg, #64c8ff, #c864ff, #ff8250);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: currentColor;
  transition: -webkit-text-fill-color 0.3s ease;
}
.glow-hover:hover,
.glow-text:hover {
  -webkit-text-fill-color: transparent;
  animation: sig-shimmer 2s ease infinite;
}

canvas#stars {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: -1; pointer-events: none;
}

/* ---- Header ---- */
.site-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 40px 8vw;
}

.signature {
  font-size: 15px; font-weight: 400; color: var(--text-mid);
  letter-spacing: 0.01em;
}
.signature a {
  color: inherit;
  background: linear-gradient(90deg, #64c8ff, #c864ff, #ff8250);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: currentColor;
  transition: -webkit-text-fill-color 0.3s ease;
}
.signature a:hover {
  -webkit-text-fill-color: transparent;
  animation: sig-shimmer 2s ease infinite;
}

@keyframes sig-shimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.nav-links { display: flex; gap: 20px; align-items: center; }

.nav-link {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 10px;
  color: var(--text-muted);
  transition: color 0.25s, background 0.25s, transform 0.25s;
}
.nav-link:hover {
  color: var(--text);
  background: rgba(255,255,255,0.06);
  transform: translateY(-2px);
}
.nav-link svg { width: 18px; height: 18px; }

/* Glow on hover per brand color */
.nav-link--gh:hover { color: #f0f0f0; box-shadow: 0 4px 16px rgba(255,255,255,0.08); }
.nav-link--x:hover { color: #f0f0f0; box-shadow: 0 4px 16px rgba(255,255,255,0.08); }
.nav-link--li:hover { color: #0a66c2; box-shadow: 0 4px 16px rgba(10,102,194,0.15); }
.nav-link--mail:hover { color: #7eb8e0; box-shadow: 0 4px 16px rgba(126,184,224,0.12); }

/* ---- Section shared ---- */
section, .newsletter-wrap { padding: 8vh 8vw; }
.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--text-muted);
  letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 40px;
}

/* ---- Animations ---- */
.anim-fade { opacity: 0; transform: translateY(12px); transition: opacity 0.6s ease, transform 0.6s ease; }
.anim-fade.vis { opacity: 1; transform: translateY(0); }
.anim-left { opacity: 0; transform: translateX(-50px); transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.7s cubic-bezier(.16,1,.3,1); }
.anim-left.vis { opacity: 1; transform: translateX(0); }
.anim-pop { opacity: 0; transform: translateY(30px) scale(0.97); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.16,1,.3,1); }
.anim-pop.vis { opacity: 1; transform: translateY(0) scale(1); }
.anim-blur { opacity: 0; filter: blur(10px); transform: scale(0.95); transition: opacity 0.8s ease, filter 0.8s ease, transform 0.8s cubic-bezier(.16,1,.3,1); }
.anim-blur.vis { opacity: 1; filter: blur(0); transform: scale(1); }
.anim-scatter { opacity: 0; transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.16,1,.3,1); }
.anim-scatter.vis { opacity: 1; transform: translate(0,0) rotate(0deg) !important; }
.anim-right { opacity: 0; transform: translateX(60px); transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.7s cubic-bezier(.16,1,.3,1); }
.anim-right.vis { opacity: 1; transform: translateX(0); }

/* ---- Footer ---- */
.site-footer {
  padding: 10vh 8vw 6vh; display: flex; justify-content: space-between;
  align-items: center; font-size: 14px; color: var(--text-muted);
}
.site-footer .footer-links { display: flex; gap: 24px; }
.site-footer a { color: var(--text-muted); transition: color 0.2s; }
.site-footer a:hover { color: var(--text); }

/* ---- Side Nav ---- */
.side-nav {
  position: fixed; right: 3vw; top: 50%; transform: translateY(-50%);
  z-index: 10; display: flex; flex-direction: column; align-items: flex-end;
  gap: 20px; transition: opacity 0.4s;
}
.side-nav-item { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.side-nav-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.06em; color: var(--text-muted); text-transform: uppercase;
  opacity: 0; transform: translateX(6px);
  transition: opacity 0.25s, transform 0.25s, color 0.25s; white-space: nowrap;
}
.side-nav-item:hover .side-nav-label, .side-nav-item.active .side-nav-label { opacity: 1; transform: translateX(0); }
.side-nav-item.active .side-nav-label { color: #fff; }
.side-nav-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
  transition: background 0.25s, transform 0.25s, box-shadow 0.25s; flex-shrink: 0;
}
.side-nav-item.active .side-nav-dot { background: #fff; transform: scale(1.4); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
.side-nav-item:hover .side-nav-dot { background: rgba(255,255,255,0.7); }

/* ---- Responsive ---- */
@media (max-width: 900px) { .side-nav { display: none; } }
@media (max-width: 700px) {
  .site-header { padding: 24px 6vw; flex-direction: column; gap: 14px; align-items: flex-start; }
  section, .newsletter-wrap { padding-left: 6vw; padding-right: 6vw; }
  .site-footer { flex-direction: column; gap: 16px; align-items: flex-start; }
}
</style>
